name: Portfolio Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Test portfolio
        run: npm test -- --watchAll=false

      - name: Build portfolio
        run: npm run build

      - name: Install responsive QA browser tools
        run: python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Start production build server
        run: |
          nohup python -m http.server 4173 --directory build > /tmp/portfolio-server.log 2>&1 &
          echo $! > /tmp/portfolio-server.pid
          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-server.log
          exit 1

      - name: Responsive browser QA
        env:
          PORTFOLIO_QA_URL: http://127.0.0.1:4173
          PORTFOLIO_QA_OUT: qa-screenshots
        run: python scripts/responsive-visual-qa.py

      - name: Upload responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 7
