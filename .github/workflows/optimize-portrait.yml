name: Optimize Portrait Candidate

on:
  push:
    branches:
      - qa-hardening-2026-09-29

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate optimized WebP portrait
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python - <<'PY'
          from PIL import Image
          source = Image.open('src/images/MyPicture.png').convert('RGB')
          source.thumbnail((960, 960), Image.Resampling.LANCZOS)
          source.save('MyPicture.webp', 'WEBP', quality=84, method=6)
          print('optimized size:', source.size)
          PY
      - name: Upload optimized portrait
        uses: actions/upload-artifact@v4
        with:
          name: optimized-portrait
          path: MyPicture.webp
          retention-days: 1
